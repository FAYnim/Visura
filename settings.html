<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visura — Pengaturan</title>
  <meta name="description" content="Konfigurasi variabel global aplikasi Visura." />
  <meta name="theme-color" content="#050505" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <!-- =====================================================
       HEADER — Branding
       ===================================================== -->
  <header class="app-header" role="banner">
    <div class="header-brand">
      <span class="brand-name">Visura</span>
    </div>
  </header>

  <div class="app-body">
    <!-- =====================================================
         SIDEBAR — Main App Navigation
         ===================================================== -->
    <aside class="app-sidebar" aria-label="Main navigation">
      <div class="sidebar-top">
        <nav class="sidebar-menu" role="navigation">
          <a class="sidebar-btn" href="index.html" id="tab-generator">
            <span class="btn-text">Prompt Generator</span>
          </a>
          <a class="sidebar-btn" href="riwayat.html" id="tab-riwayat">
            <span class="btn-text">History</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <!-- Profile & Settings Area — active on this page -->
        <div class="sidebar-profile-section">
          <a href="settings.html" id="btn-settings-profile" class="sidebar-profile-btn active" aria-label="Buka Pengaturan Profil" title="Pengaturan Profil" aria-current="page">
            <div class="avatar-container">
              <img src="avatar.png" alt="Profile" class="profile-avatar-img" />
            </div>
            <div class="profile-info-text">
              <span class="profile-name">John Doe</span>
            </div>
          </a>
        </div>
      </div>
    </aside>

    <!-- =====================================================
         CONTENT WORKSPACE
         ===================================================== -->
    <div class="app-content">
      <div id="view-settings" class="app-view active">
        <div class="settings-container">
          <header class="settings-header">
            <div class="settings-title-group">
              <h1 class="settings-title">Pengaturan Global</h1>
              <p class="settings-desc">Konfigurasi variabel global aplikasi.</p>
            </div>
          </header>

          <div class="settings-grid">
            <!-- Left Side: Fields -->
            <div class="settings-fields-column">
              <!-- Creator Info Card -->
              <div class="settings-card">
                <h3 class="settings-card-title"><i class="fa-regular fa-user"></i> Informasi Creator</h3>
                <div class="settings-card-body">
                  <div class="field">
                    <label class="field-label" for="setting-creator-name">Nama Pembuat <span class="var-hint">{{CREATOR_NAME}}</span></label>
                    <input type="text" id="setting-creator-name" placeholder="e.g. Faris AY" autocomplete="off" />
                  </div>
                  <div class="field">
                    <label class="field-label" for="setting-creator-role">Peran Pembuat <span class="var-hint">{{CREATOR_ROLE}}</span></label>
                    <input type="text" id="setting-creator-role" placeholder="e.g. Creative Engineer" autocomplete="off" />
                  </div>
                </div>
              </div>

            </div>

            <div class="settings-options-column">
              <!-- Control Actions Card -->
              <div class="settings-card">
                <h3 class="settings-card-title"><i class="fa-solid fa-sliders"></i> Tindakan Pengaturan</h3>
                <div class="settings-card-body">
                  <div class="settings-action-buttons">
                    <button class="btn btn-primary" id="btn-save-settings" style="width: 100%; margin-bottom: 10px;">
                      <span class="btn-icon"><i class="fa-solid fa-check"></i></span> Simpan Perubahan
                    </button>
                    <button class="btn btn-secondary" id="btn-reset-settings" style="width: 100%;">
                      <span class="btn-icon"><i class="fa-solid fa-rotate-left"></i></span> Reset ke Default
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div><!-- /view-settings -->
    </div><!-- /app-content -->
  </div><!-- /app-body -->

  <!-- Glassmorphic overlay backdrop for mobile sidebar drawer -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- =====================================================
       TOAST NOTIFICATION
       ===================================================== -->
  <div class="toast" id="app-toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="settings.js"></script>
</body>
</html>
