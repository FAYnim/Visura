<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visura — Prompt History</title>
  <meta name="description" content="View and manage prompt history you have previously copied in Visura." />
  <meta name="theme-color" content="#050505" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/logo/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logo/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/img/logo/favicon-16x16.png" />
  <link rel="icon" href="/img/logo/favicon.ico" />
  <link rel="manifest" href="/img/logo/site.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <!-- =====================================================
       HEADER — Branding & Global Creator Name Input
       ===================================================== -->
  <header class="app-header" role="banner">
    <div class="header-brand">
      <img src="/img/logo/android-chrome-192x192.png" alt="Visura Logo" class="brand-logo" />
      <span class="brand-name">Visura</span>
    </div>
    <button id="sidebar-toggle-mobile" class="header-toggle-btn" aria-label="Toggle navigation">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <div class="app-body">
    <!-- =====================================================
         SIDEBAR — Main App Navigation
         ===================================================== -->
    <aside class="app-sidebar" aria-label="Main navigation">
      <div class="sidebar-top">
        <nav class="sidebar-menu" role="navigation">
          <a class="sidebar-btn" href="/app" id="tab-generator">
            <span class="btn-text"><i class="fa-solid fa-wand-magic-sparkles"></i> Prompt Generator</span>
          </a>
          <a class="sidebar-btn active" href="/history" id="tab-history" aria-current="page">
            <span class="btn-text"><i class="fa-solid fa-clock-rotate-left"></i> History</span>
          </a>
          <a class="sidebar-btn" href="/prompts" id="tab-prompts">
            <span class="btn-text"><i class="fa-solid fa-layer-group"></i> Prompt Manager</span>
          </a>
          <a class="sidebar-btn" href="/linkedin" id="tab-linkedin">
            <span class="btn-text"><i class="fa-brands fa-linkedin"></i> LinkedIn Generator</span>
          </a>
          <a class="sidebar-btn" href="/byok" id="tab-byok">
            <span class="btn-text"><i class="fa-solid fa-key"></i> API Keys</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <!-- Profile & Settings Area -->
        <div class="sidebar-profile-section">
          <a href="/settings" id="btn-settings-profile" class="sidebar-profile-btn" aria-label="Open Profile Settings" title="Profile Settings">
            <div class="avatar-container">
              <img src="/img/avatar.png" alt="Profile" class="profile-avatar-img" />
            </div>
            <div class="profile-info-text">
              <span class="profile-name profile-name-loading" aria-label="Loading profile name"></span>
            </div>
          </a>
        </div>
      </div>
    </aside>

    <!-- =====================================================
         CONTENT WORKSPACE
         ===================================================== -->
    <div class="app-content">
      <div id="view-history" class="app-view active">
        <div class="history-container">
          <header class="history-header">
            <div class="history-title-group">
              <h1 class="history-title">Prompt History</h1>
              <p class="history-desc">List of prompts you have previously copied.</p>
            </div>
            <div class="history-actions">
              <button class="btn btn-secondary" id="btn-clear-history" aria-label="Clear all prompt history">
                <span class="btn-icon"><i class="fa-regular fa-trash-can"></i></span>
                Clear All
              </button>
            </div>
          </header>

          <div class="history-search-bar">
            <span class="search-icon" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input
              type="text"
              id="history-search"
              placeholder="Search history by slide title, creator name, or prompt text..."
              autocomplete="off"
              spellcheck="false"
              aria-label="Search prompt history"
            />
          </div>

          <!-- Dynamic history cards container -->
          <div class="history-list" id="history-list" aria-busy="true">
            <div class="history-skeleton-card" aria-hidden="true">
              <span class="history-skeleton-line history-skeleton-title"></span>
              <span class="history-skeleton-line history-skeleton-text"></span>
              <span class="history-skeleton-line history-skeleton-text"></span>
              <span class="history-skeleton-line history-skeleton-text history-skeleton-text-short"></span>
              <span class="history-skeleton-line history-skeleton-footer"></span>
            </div>
            <div class="history-skeleton-card" aria-hidden="true">
              <span class="history-skeleton-line history-skeleton-title"></span>
              <span class="history-skeleton-line history-skeleton-text"></span>
              <span class="history-skeleton-line history-skeleton-text"></span>
              <span class="history-skeleton-line history-skeleton-text history-skeleton-text-short"></span>
              <span class="history-skeleton-line history-skeleton-footer"></span>
            </div>
            <div class="history-skeleton-card" aria-hidden="true">
              <span class="history-skeleton-line history-skeleton-title"></span>
              <span class="history-skeleton-line history-skeleton-text"></span>
              <span class="history-skeleton-line history-skeleton-text"></span>
              <span class="history-skeleton-line history-skeleton-text history-skeleton-text-short"></span>
              <span class="history-skeleton-line history-skeleton-footer"></span>
            </div>
            <div class="history-skeleton-card" aria-hidden="true">
              <span class="history-skeleton-line history-skeleton-title"></span>
              <span class="history-skeleton-line history-skeleton-text"></span>
              <span class="history-skeleton-line history-skeleton-text"></span>
              <span class="history-skeleton-line history-skeleton-text history-skeleton-text-short"></span>
              <span class="history-skeleton-line history-skeleton-footer"></span>
            </div>
          </div>
        </div>
      </div><!-- /view-history -->
    </div><!-- /app-content -->
  </div><!-- /app-body -->

  <!-- Glassmorphic overlay backdrop for mobile sidebar drawer -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- =====================================================
       TOAST NOTIFICATION
       ===================================================== -->
  <div class="toast" id="app-toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="/js/history.js"></script>
</body>
</html>
