<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visura — Settings</title>
  <meta name="description" content="Configure global application variables in Visura." />
  <meta name="theme-color" content="#050505" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/logo/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logo/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/img/logo/favicon-16x16.png" />
  <link rel="icon" href="/img/logo/favicon.ico" />
  <link rel="manifest" href="/img/logo/site.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <!-- =====================================================
       HEADER — Branding
       ===================================================== -->
  <header class="app-header" role="banner">
    <div class="header-brand">
      <img src="/img/logo/android-chrome-192x192.png" alt="Visura Logo" class="brand-logo" />
      <span class="brand-name">Visura</span>
    </div>
    <button id="sidebar-toggle-mobile" class="header-toggle-btn" aria-label="Toggle navigation">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <div class="app-body">
    <!-- =====================================================
         SIDEBAR — Main App Navigation
         ===================================================== -->
    <aside class="app-sidebar" aria-label="Main navigation">
      <div class="sidebar-top">
        <nav class="sidebar-menu" role="navigation">
          <a class="sidebar-btn" href="/app" id="tab-generator">
            <span class="btn-text"><i class="fa-solid fa-wand-magic-sparkles"></i> Prompt Generator</span>
          </a>
          <a class="sidebar-btn" href="/history" id="tab-history">
            <span class="btn-text"><i class="fa-solid fa-clock-rotate-left"></i> History</span>
          </a>
          <a class="sidebar-btn" href="/prompts" id="tab-prompts">
            <span class="btn-text"><i class="fa-solid fa-layer-group"></i> Prompt Manager</span>
          </a>
          <a class="sidebar-btn" href="/linkedin" id="tab-linkedin">
            <span class="btn-text"><i class="fa-brands fa-linkedin"></i> LinkedIn Generator</span>
          </a>
          <a class="sidebar-btn" href="/byok" id="tab-byok">
            <span class="btn-text"><i class="fa-solid fa-key"></i> API Keys</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <!-- Profile & Settings Area — active on this page -->
        <div class="sidebar-profile-section">
          <a href="/settings" id="btn-settings-profile" class="sidebar-profile-btn active" aria-label="Open Profile Settings" title="Profile Settings" aria-current="page">
            <div class="avatar-container">
              <img src="/img/avatar.png" alt="Profile" class="profile-avatar-img" />
            </div>
            <div class="profile-info-text">
              <span class="profile-name profile-name-loading" aria-label="Loading profile name"></span>
            </div>
          </a>
        </div>
      </div>
    </aside>

    <!-- =====================================================
         CONTENT WORKSPACE
         ===================================================== -->
    <div class="app-content">
      <div id="view-settings" class="app-view active">
        <div class="settings-container">
          <header class="settings-header">
            <div class="settings-title-group">
              <h1 class="settings-title">Global Settings</h1>
              <p class="settings-desc">Configure global application variables.</p>
            </div>
          </header>

          <div class="settings-grid">
            <!-- Left Side: Fields -->
            <div class="settings-fields-column">
              <!-- Creator Info Card -->
              <div class="settings-card">
                <h3 class="settings-card-title"><i class="fa-regular fa-user"></i> Creator Information</h3>
                <div class="settings-card-body">
                  <div class="field">
                    <label class="field-label" for="setting-creator-name">Creator Name <span class="var-hint">{{CREATOR_NAME}}</span></label>
                    <input type="text" id="setting-creator-name" placeholder="e.g. John Doe" autocomplete="off" />
                  </div>
                  <div class="field">
                    <label class="field-label" for="setting-creator-role">Creator Role <span class="var-hint">{{CREATOR_ROLE}}</span></label>
                    <input type="text" id="setting-creator-role" placeholder="e.g. Creative Engineer" autocomplete="off" />
                  </div>
                </div>
              </div>

            </div>

            <div class="settings-options-column">
              <!-- Control Actions Card -->
              <div class="settings-card">
                <h3 class="settings-card-title"><i class="fa-solid fa-sliders"></i> Settings Actions</h3>
                <div class="settings-card-body">
                  <div class="settings-action-buttons">
                    <button class="btn btn-primary" id="btn-save-settings" style="width: 100%; margin-bottom: 10px;">
                      <span class="btn-icon"><i class="fa-solid fa-check"></i></span> Save Changes
                    </button>
                    <button class="btn btn-secondary" id="btn-reset-settings" style="width: 100%;">
                      <span class="btn-icon"><i class="fa-solid fa-rotate-left"></i></span> Reset to Default
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div><!-- /view-settings -->
    </div><!-- /app-content -->
  </div><!-- /app-body -->

  <!-- Glassmorphic overlay backdrop for mobile sidebar drawer -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- =====================================================
       TOAST NOTIFICATION
       ===================================================== -->
  <div class="toast" id="app-toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="/js/settings.js"></script>
</body>
</html>
